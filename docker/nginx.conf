# ==========================================================================
# nginx.conf — Ruslovar API Demo Container
#
# This config is used inside the demo Docker container, built from
# docker/demo.Dockerfile. It serves the static demo page files located
# in /usr/share/nginx/html/ (which are copied from client/demo/ during
# the Docker build).
#
# The demo page is a single-page web app that makes HTTP requests to the
# ruslovar-api container. nginx only serves the static HTML/CSS/JS; it
# does not proxy API requests.
#
# The container listens on port 80 internally, which docker-compose maps
# to host port 8080.
# ==========================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

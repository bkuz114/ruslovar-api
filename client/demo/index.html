<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демонстрация склонений — Ruslovar API</title>
    <link rel="stylesheet" href="assets/css/demo.css">
</head>

<body>
    <header class="site-header">
        <h1 id="page-title" data-i18n="page_title">Демонстрация склонений</h1>
        <div class="language-toggle" role="group" aria-label="Выбор языка">
            <button type="button" id="lang-ru" class="lang-button active" aria-pressed="true">RU</button>
            <button type="button" id="lang-en" class="lang-button" aria-pressed="false">EN</button>
        </div>
    </header>

    <main class="demo-container">
        <form id="lookup-form" class="lookup-form" novalidate>
            <div class="form-group">
                <label for="word-input" id="word-label" data-i18n="word_label">Существительное</label>
                <input type="text" id="word-input" name="word" data-i18n-placeholder="word_placeholder" placeholder="Например: кролик" autocomplete="off" required>
            </div>

            <div class="form-group form-group-inline">
                <input type="checkbox" id="strict-mode" name="strict">
                <label for="strict-mode" id="strict-label" data-i18n="strict_label">Строгий режим</label>
            </div>

            <button type="submit" id="submit-button" class="submit-button" data-i18n="submit_button">Показать склонения</button>
        </form>

        <section id="results-area" class="results-area" aria-live="polite" aria-label="Результаты">
            <p id="results-placeholder" class="results-placeholder" data-i18n="results_placeholder">Введите слово, чтобы увидеть склонения.</p>
        </section>
    </main>

    <script src="assets/js/demo.js"></script>
</body>

</html>

# -----------------------------------------------------------------------------
# Workflow: Build and Push Multi-Arch Images for ruslovar-api (FastAPI server)
# and ruslovar-client (Web Client).
#
# [Note: ruslovar-db Image workflow lives on the ruslovar-db repo]
#
# Builds Docker images for linux/amd64 and linux/arm64 using buildx, then
# pushes them to a container registry (e.g., Docker Hub).
#
# Triggered manually via the Actions tab.
# Selects which image(s) to build from dropdown and optionally supply a version tag.
#
# Required repository variables (Settings → Secrets and variables → Actions → Variables):
#   REGISTRY               - Registry hostname (e.g., docker.io)
#   API_IMAGE_NAME         - API image name only (e.g., my-api, NOT johndoe/my-api)
#   WEBCLIENT_IMAGE_NAME   - Webclient image name only (e.g., my-webclient)
#
# Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   DOCKERHUB_USERNAME     - Registry username (also used as the repository namespace)
#   DOCKERHUB_TOKEN        - Registry access token
# -----------------------------------------------------------------------------

name: Build and Push Multi-Arch Images

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Which image to build'
        required: true
        type: choice
        options:
          - api
          - webclient
          - both
        default: 'both'

      version:
        description: 'Version tag (e.g., v1.2.0). Leave empty for latest only.'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ${{ vars.REGISTRY }}
  API_IMAGE_NAME: ${{ vars.API_IMAGE_NAME }}
  WEBCLIENT_IMAGE_NAME: ${{ vars.WEBCLIENT_IMAGE_NAME }}

jobs:
  # ---------------------------------------------------------------------------
  # Build and push the API image
  # ---------------------------------------------------------------------------
  build-api:
    if: github.event.inputs.image == 'api' || github.event.inputs.image == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push with both :latest and :<version> tags.
      - name: Build and push (version + latest)
        if: github.event.inputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:${{ github.event.inputs.version }}

      # Build and push with only :latest tag.
      - name: Build and push (latest only)
        if: github.event.inputs.version == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}:latest

  # ---------------------------------------------------------------------------
  # Build and push the webclient image
  # ---------------------------------------------------------------------------
  build-webclient:
    if: github.event.inputs.image == 'webclient' || github.event.inputs.image == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push with both :latest and :<version> tags.
      - name: Build and push (version + latest)
        if: github.event.inputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/webclient.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEBCLIENT_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEBCLIENT_IMAGE_NAME }}:${{ github.event.inputs.version }}

      # Build and push with only :latest tag.
      - name: Build and push (latest only)
        if: github.event.inputs.version == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/webclient.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEBCLIENT_IMAGE_NAME }}:latest
